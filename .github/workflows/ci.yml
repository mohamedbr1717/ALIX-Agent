name: ALIX V4 Security & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install coverage python-dotenv

      - name: Run Core Unit Tests
        run: |
          python -m unittest test_generated_executor.py
          python -m unittest test_generated_policy.py

      - name: Run AST Benchmark
        run: |
          python benchmark_engine.py

      - name: Run Coverage Report
        run: |
          coverage run --omit="wasm_sandbox.py,policy_watcher.py,test_*.py" -m unittest discover -p "test_*.py"
          coverage report -m --fail-under=80
